[project]
name = "unveiling-deepfake"
version = "0.1.0"
description = "Deepfake detection inference (SCRFD + Xception TorchScript)"
readme = "INFERENCE.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.4.1+cu124",
    "torchvision==0.19.1+cu124",
    "onnxruntime-gpu==1.19.2",
    "opencv-python==4.11.0.86",
    "albumentations==1.4.24",
    "torchjpeg==0.9.33",
    "numpy==2.2.6",
    "pillow==12.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

# Pin transitive deps to match the verified working environment (uv pip freeze).
[tool.uv]
constraint-dependencies = [
    "filelock==3.29.0",
    "packaging==24.1",
]
